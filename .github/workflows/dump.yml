name: api-dump

# Development helper: decompiles the game's client code with Loom and stores it, ENCRYPTED with the DUMP_KEY
# secret, on the "api-dump" branch, so the mod's code can be written against the exact 26.3 classes without
# publishing Mojang's code. Delete the branch when done: git push origin --delete api-dump
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Decompile
        run: ./gradlew :metal:genSources --console=plain

      - name: Collect
        run: |
          set -eu
          mkdir -p out/src out/javap
          src=$(find ~/.gradle .gradle -name 'minecraft-*sources.jar' 2>/dev/null | head -1)
          echo "sources: $src"
          (cd out/src && unzip -q "$src" 'net/minecraft/client/*' 'net/minecraft/core/particles/*' \
             'net/minecraft/world/level/material/FogType*' 'net/minecraft/network/chat/*' 'net/minecraft/resources/*' \
             'net/minecraft/world/entity/player/Inventory*' 'net/minecraft/util/ARGB*' 'net/minecraft/util/Mth*' || true)
          # Mojang's renderer library ships as its own jar: signatures only
          for j in $(find ~/.gradle -name '*renderpearl*.jar' -o -name 'blaze3d*.jar' 2>/dev/null | sort -u); do
            n=$(basename "$j" .jar)
            unzip -Z1 "$j" | grep '\.class$' | sed 's/\.class$//' > "out/javap/$n.classes"
            javap -p -cp "$j" $(sed 's#/#.#g' "out/javap/$n.classes") > "out/javap/$n.txt" 2>&1 || true
          done
          ./gradlew -q :metal:dependencies --configuration compileClasspath > out/classpath.txt || true
          tar -C out -cJf dump.tar.xz .
          ls -la dump.tar.xz

      - name: Encrypt and push
        env:
          DUMP_KEY: ${{ secrets.DUMP_KEY }}
        run: |
          set -eu
          [ -n "$DUMP_KEY" ] || { echo "::error::DUMP_KEY secret missing"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in dump.tar.xz -out dump.bin -pass env:DUMP_KEY
          split -b 40m dump.bin dump.bin.part.
          git config user.name "dump-bot"; git config user.email "dump-bot@users.noreply.github.com"
          git checkout --orphan api-dump
          git rm -rfq --cached . >/dev/null
          git add -f dump.bin.part.*
          git commit -qm "encrypted API dump"
          git push -f origin api-dump
